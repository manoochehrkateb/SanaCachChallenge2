name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SanaCash.GoldCredit.sln

      - name: Build
        run: dotnet build SanaCash.GoldCredit.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SanaCash.GoldCredit.sln --no-build --configuration Release --verbosity normal
